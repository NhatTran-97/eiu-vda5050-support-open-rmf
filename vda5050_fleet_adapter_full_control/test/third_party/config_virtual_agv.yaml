# Fleet of vda-5050-lib virtual AGVs (virtual_agv.js) on a private local broker.

rmf_fleet:
  name: "virtual_fleet"
  limits:
    linear: [0.5, 1.0]         # v_max m/s, a_max m/s^2
    angular: [1.0, 3.2]        # w_max rad/s, alpha_max rad/s^2
  profile:
    footprint: 0.15            # m
    vicinity: 0.30             # m
  reversible: true

  battery_system:
    voltage: 11.1              # V
    capacity: 1.8              # Ah
    charging_current: 1.0      # A
  mechanical_system:
    mass: 1.0                  # kg
    moment_of_inertia: 0.005   # kg*m^2
    friction_coefficient: 0.22
  ambient_system: {power: 20.0}
  tool_system: {power: 0.0}
  recharge_threshold: 0.10
  recharge_soc: 1.0
  publish_fleet_state: 10.0
  account_for_battery_drain: false

  task_capabilities:
    loop: true
    delivery: true
  #actions: ["dock"]
  finishing_request: "park"    # park | charge | nothing

  robots:
    virtual_1:
      charger: "charger_1"
      responsive_wait: false
    virtual_2:
      charger: "charger_2"
      responsive_wait: false
    virtual_3:
      charger: "charger_3"
      responsive_wait: false

vda5050:
  interface_name: "AMR"
  update_rate_hz: 10.0
  honor_waypoint_timing: true
  stitch_on_replan: true
  strict_validation: true
  cap_edge_speed_to_fleet: false
  charge_at_chargers: true
  stale_state_streak: 3              # 0 = off
  cancel_confirm_timeout_s: 5        # 0 = off
  cancel_attempts: 3
  state_timeout_s: 10
  order_stuck_timeout_s: 15
  order_ack_timeout_s: 5
  order_resend_attempts: 2           # 0 = off
  cancel_unknown_orders: true
  traffic_pause_timeout_s: 10
  factsheet_first_wait_s: 5
  factsheet_retry_wait_s: 20
  factsheet_request_attempts: 3      # 0 = off
  waypoint_reached_m: 0.5
  same_pose_m: 0.05
  same_pose_rad: 0.05
  usable_speed_mps: 0.05
  early_arrival_warn_s: 2.0
  metrics_period_s: 60               # 0 = off
  dock_actions: {}                   # dock: {action, parameters}
  registration:
    discovery_grace_s: 8.0
    discovery_period_s: 2.0
    timeout_s: 30
    limit_tolerance: 0.05
  mqtt:
    host: "127.0.0.1"
    port: 18830
    username: null
    password: null
    tls:
      enabled: false
    keep_alive_s: 60
    connect_timeout_s: 10
    reconnect_min_s: 1
    reconnect_max_s: 30
    max_payload_bytes: 1048576
    qos: 1                           # connection: always 1

  robots:
    virtual_1:
      manufacturer: "THIRDPARTY"
      serial: "0001"
      transform: {rotation: 0.0, scale: 1.0, translation: [0.0, 0.0]}
    virtual_2:
      manufacturer: "THIRDPARTY"
      serial: "0002"
      transform: {rotation: 0.0, scale: 1.0, translation: [0.0, 0.0]}
    virtual_3:
      manufacturer: "THIRDPARTY"
      serial: "0003"
      transform: {rotation: 0.0, scale: 1.0, translation: [0.0, 0.0]}
