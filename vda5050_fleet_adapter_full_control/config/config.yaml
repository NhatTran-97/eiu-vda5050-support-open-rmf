# Fleet and VDA5050 settings for the adapter.

rmf_fleet:
  name: "tb3_fleet"
  limits:
    linear: [0.5, 0.75]      # [v_max, a_max] m/s, m/s^2
    angular: [0.6, 2.0]      # [w_max, alpha_max] rad/s, rad/s^2
  profile:                    # robot footprint (circle radius, m)
    footprint: 0.3
    vicinity: 0.5
  reversible: true
  battery_system:
    voltage: 12.0
    capacity: 24.0
    charging_current: 5.0
  mechanical_system:
    mass: 20.0
    moment_of_inertia: 10.0
    friction_coefficient: 0.22
  ambient_system: {power: 20.0}
  tool_system: {power: 0.0}
  recharge_threshold: 0.10
  recharge_soc: 1.0
  publish_fleet_state: 10.0

  account_for_battery_drain: false
  task_capabilities:
    loop: true
    delivery: true
  actions: ["dock"]

  finishing_request: "park"   # Post-task action: park, charge, or nothing
  # Park robots at their charger waypoint after a task.

  robots:
    tb3_1:
      charger: "charger_1"

      responsive_wait: false

# VDA5050 and MQTT settings used by the adapter.
vda5050:
  # Match the AGV's MQTT interface, manufacturer, and serial number.
  interface_name: "TB3"
  update_rate_hz: 10.0
  mqtt:
    host: "localhost"     
    port: 1883
    username: null
    password: null
  robots:
    tb3_1:                 
      manufacturer: "ROBOTIS"
      serial: "0001"
      transform:             
        rotation: 0.0        
        scale: 1.0
        translation: [0.0, 0.0]
