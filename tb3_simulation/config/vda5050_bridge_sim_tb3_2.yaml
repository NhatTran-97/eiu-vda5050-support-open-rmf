/**:
  ros__parameters:
    adapter_ns: "/tb3_2/vda5050_client_adapter"
    odom_topic: "/tb3_2/odom"
    amcl_pose_topic: "/tb3_2/amcl_pose"
    battery_topic: "/tb3_2/battery_state"
