services:
  tb3-simulation:
    build: .
    image: eiu-artc/tb3-simulation
    tty: true
    container_name: tb3-simulation
    network_mode: host
    gpus: all

    volumes:
      - ${HOME}/ros2_ws:/home/eiu/sim_ws/
      - tb3-build:/home/eiu/build
      - tb3-install:/home/eiu/install
      - tb3-log:/home/eiu/log
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.config/open-robotics:/home/eiu/.config/open-robotics
      - ${HOME}/.cache/open-robotics:/home/eiu/.cache/open-robotics
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/home/eiu/.Xauthority:ro

    environment:
      - ENV=development
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/home/eiu/.Xauthority
      - QT_X11_NO_MITSHM=1
      - QT_XCB_GL_INTEGRATION=xcb_glx
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,display
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __VK_LAYER_NV_optimus=NVIDIA_only
      - TURTLEBOT3_MODEL=burger
      - ROS_DOMAIN_ID=1
      # 3 full Nav2 stacks create 60-80+ ROS 2 nodes in one domain, past
      # CycloneDDS's default auto-participant-index pool ("Failed to find a
      # free participant index for domain 1" -> node aborts on startup).
      - CYCLONEDDS_URI=file:///home/eiu/sim_ws/src/tb3_simulation/config/cyclonedds_sim.xml

    devices:
      - /dev/dri:/dev/dri

    group_add:
      - video
      - "110"  # host's "render" group (GID for /dev/dri/renderD128) — lets eiu open the GPU render node

    privileged: true

volumes:
  tb3-build:
  tb3-install:
  tb3-log:
