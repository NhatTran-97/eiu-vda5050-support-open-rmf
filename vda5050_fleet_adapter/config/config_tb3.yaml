# Fleet and VDA5050 settings for the TB3 fleet adapter instance.
# See config_amr.yaml for the AMR fleet (different footprint/kinematics —
# each robot type needs its own fleet adapter instance, see README).

rmf_fleet:
  name: "tb3_fleet"
  limits:
  
    linear: [0.22, 1.0]      # [v_max, a_max] m/s, m/s^2
    angular: [1.0, 3.2]      # [w_max, alpha_max] rad/s, rad/s^2

  profile:
    footprint: 0.15   # bán kính (radius, m) hình tròn xấp xỉ thân robot
    vicinity: 0.30    # bán kính vùng "riêng tư"
  reversible: true


  battery_system:
    voltage: 11.1        # V -- stock 3S Li-Po
    capacity: 1.8         # Ah -- stock 1800mAh Li-Po
    charging_current: 1.0 # A -- rough estimate, 

  mechanical_system:
    mass: 1.0              # kg -- stock TB3 Burger weight
    moment_of_inertia: 0.005 # kg*m^2 -- rough estimate, not measured
    friction_coefficient: 0.22

  ambient_system: {power: 20.0}
  tool_system: {power: 0.0}
  recharge_threshold: 0.10
  recharge_soc: 1.0
  publish_fleet_state: 10.0

  account_for_battery_drain: false

  task_capabilities:
    loop: true # Patrol Tassk
    delivery: true # Delivery Task
  #actions: ["dock"]

  finishing_request: "park"   # Post-task action: park, charge, or nothing

  robots:
    tb3_1:
      charger: "charger_2"
      responsive_wait: false

    tb3_2:
      charger: "charger_1"
      responsive_wait: false

# VDA5050 and MQTT settings used by the adapter.
vda5050:
  # Match the AGV's MQTT interface, manufacturer, and serial number.
  interface_name: "AMR"
  update_rate_hz: 10.0
  # Reject orders and actions that break the factsheet.
  strict_validation: true
  # Extend a still-live order with a new destination instead of cancelling it.
  stitch_on_replan: false
  mqtt:
    host: "192.168.10.97"
    port: 1883
    username: null
    password: null

  robots:
    tb3_1:
      manufacturer: "ROBOTIS"
      serial: "0001"
      transform:
        rotation: 0.0
        scale: 1.0
        translation: [0.0, 0.0]

    tb3_2:
      manufacturer: "ROBOTIS"
      serial: "0002"
      transform:
        rotation: 0.0
        scale: 1.0
        translation: [0.0, 0.0]
