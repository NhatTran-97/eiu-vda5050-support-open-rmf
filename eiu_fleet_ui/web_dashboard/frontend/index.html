<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1f47" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EIU Robot Services</title>
    <script>
      // Theme before the first paint; src/lib/theme.ts keeps it up to date.
      try {
        var p = localStorage.getItem('eiu-theme')
        var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
