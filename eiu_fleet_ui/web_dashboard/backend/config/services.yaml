# Robot services: what operators request, the task form of each, and the fleets that can do it.
# See ../README.md "Services" for every key and field type.

services:
  - id: delivery
    name: {vi: "Giao vận", en: "Delivery"}
    description: {vi: "Vận chuyển tài liệu, bưu kiện và thiết bị", en: "Transport documents, parcels and equipment"}
    icon: package
    enabled: true
    category: delivery
    capabilities: [transport]
    form:
      - {key: pickup, type: location, required: true}
      - {key: dropoff, type: location, required: true, differs_from: pickup}
      - {key: itemType, type: select, options: [documents, parcel, lab_equipment, food, general], default: general}
      - {key: priority, type: select, options: [normal, high], default: normal}
      - {key: schedule, type: schedule}
      - {key: note, type: text, max: 200}

  - id: cleaning
    name: {vi: "Vệ sinh", en: "Cleaning"}
    description: {vi: "Dịch vụ vệ sinh tự động", en: "Autonomous cleaning service"}
    icon: sparkles
    enabled: true
    category: clean
    capabilities: [cleaning]
    form:
      - {key: area, type: area, required: true}
      - {key: cleaningMode, type: select, options: [full_area, spot, custom_zone], default: full_area}
      - {key: duration, type: number, min: 5, max: 240, unit: min}
      - {key: schedule, type: schedule, repeat: true}
      - {key: note, type: text, max: 200}

  - id: patrol
    name: {vi: "Tuần tra", en: "Patrol"}
    description: {vi: "Nhiệm vụ tuần tra tự động", en: "Autonomous patrol missions"}
    icon: shield
    enabled: true
    category: patrol
    capabilities: [patrol]
    form:
      - {key: zone, type: zone, required: true}
      - {key: route, type: route, required: true, filter: zone}
      - {key: rounds, type: number, min: 1, max: 10, default: 1}
      - {key: schedule, type: schedule, repeat: true}
      - {key: note, type: text, max: 200}

# RMF fleet name: primary service and capabilities of its robots.
fleets:
  tb3_fleet: {service: delivery, capabilities: [transport, patrol]}
  amr_fleet: {service: delivery, capabilities: [transport, patrol]}
