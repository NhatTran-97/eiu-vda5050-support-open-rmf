# Settings of the EIU fleet dashboard. Every key is optional; the values below are the defaults.
# A named environment variable overrides its key.
# EIU_UI_CONFIG=/path/to/file.yaml selects another settings file.

dashboard:
  refresh_period_s: 0.2          # EIU_UI_REFRESH_PERIOD: panel refresh period; robot markers move smoothly in between

rmf:
  offline_after_s: 5.0           # EIU_RMF_OFFLINE_AFTER: time without /fleet_states before RMF or a fleet is shown offline
  dispatch_timeout_s: 15.0       # EIU_DISPATCH_TIMEOUT: time to wait for the dispatcher to answer a dispatch or cancel
  default_level: "L1"            # level shown when a fleet reports none

tasks:
  history: 50                    # EIU_TASK_HISTORY: tasks kept in the table and the task cache
  cache_write_delay_s: 1.0       # EIU_TASK_CACHE_DELAY: minimum time between writes of the task cache

commands:
  timeout_s: 10.0                # EIU_COMMAND_TIMEOUT: time to wait for an answer to pause, resume, speed limit or re-localize

registration:
  reply_timeout_s: 10.0          # EIU_REGISTRATION_TIMEOUT: time to wait for an answer to a registration request

vda5050:
  state_stale_after_s: 5.0       # EIU_STATE_STALE_AFTER: time without a VDA5050 state before a robot is shown offline
  stale_state_intervals: 2.0     # EIU_STALE_STATE_INTERVALS: AGV state intervals without a state before it is shown offline, if longer
  traffic_log_size: 200          # messages kept in the VDA5050 traffic log
  off_graph_limit_m: 1.2         # distance from every lane beyond which a robot is off the graph
  off_graph_hold_s: 5.0          # time a robot must stay off the graph before it is reported

adapter_metrics:
  history_samples: 120           # EIU_METRICS_HISTORY: metrics reports kept per fleet adapter for the charts
  silent_factor: 3.0             # EIU_METRICS_SILENT_FACTOR: missed report periods before an adapter is shown as silent
  grace_s: 10.0                  # EIU_ADAPTER_GRACE_S: time after start before a missing adapter is reported

operator:
  low_battery_percent: 20        # battery below this level is a warning, shown in red
  medium_battery_percent: 50     # battery below this level is shown in amber

map:
  pick_radius_m: 0.6             # click distance that selects a waypoint
  lane_pick_radius_m: 0.35       # click distance that selects a lane in the graph editor
  min_zoom: 0.4
  max_zoom: 8.0
