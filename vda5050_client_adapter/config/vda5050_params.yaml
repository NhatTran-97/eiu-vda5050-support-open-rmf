/**:
  ros__parameters:

    # ── MQTT broker connection ──────────────────────────────────────────────
    mqtt:
      broker_url: "tcp://localhost:1883"   # MQTT broker URL
      client_id:  "vda5050_client_adapter_001"
      username:   ""
      password:   ""

    # ── VDA5050 AGV identity ────────────────────────────────────────────────
    # MQTT topic structure: {interface_name}/v2/{manufacturer}/{serial_number}/{topic}
    vda5050:
      interface_name: "TB3"       # VDA5050 interface name
      manufacturer:   "ROBOTIS"        # Manufacturer identifier
      serial_number:  "0001"       # AGV serial number

      state_publish_interval: 30.0       # State message interval (sec)
      visualization_interval: 1.0        # Visualization interval (sec)
      position_publish_min_interval: 1.0 # Min interval for on-position-update state publishes (sec)
      hard_action_pause_timeout: 30.0    # Max wait for HARD action pause confirmation (sec)

    # ── Factsheet (VDA5050 §9.4) ────────────────────────────────────────────
    # Published once on connect (QoS 1, retained).
    factsheet:

      # ── typeSpecification ─────────────────────────────────────────────────
      type_specification:
        series_name:        "TurtleBot3 Burger"
        series_description: "Indoor differential-drive mobile robot"
        agv_kinematic: "DIFF"               # "DIFF" | "OMNI" | "THREEWHEEL"
        agv_class: "CARRIER"                # "FORKLIFT" | "CONVEYOR" | "TUGGER" | "CARRIER"
        max_load_mass: 0.5                  # Max load (kg)
        localization_types: ["NATURAL"]     # Supported localization technologies
        navigation_types: ["AUTONOMOUS"]    # Navigation method

      # ── physicalParameters ────────────────────────────────────────────────
      physical_parameters:
        speed_min:        0.05      # m/s
        speed_max:        0.22      # m/s
        acceleration_max: 1.0       # m/s²
        deceleration_max: 2.0       # m/s²
        height_min:      -1.0       # m  (-1.0 to omit)
        height_max:       0.192     # m
        width:            0.178     # m
        length:           0.138     # m

      # ── supported action types ────────────────────────────────────────────
      supported_action_types:
        - "startPause"
        - "stopPause"
        - "cancelOrder"
        - "stateRequest"
        - "initPosition"
